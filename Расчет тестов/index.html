ns:[`Я отношусь к себе так же, как всегда.`,`Я потерял уверенность в себе.`,`Я разочарован в себе.`,`Я себя ненавижу.`]},{options:[`Я не критикую и не обвиняю себя больше, чем обычно.`,`Я более критичен к себе, чем раньше.`,`Я критикую себя за все свои ошибки.`,`Я обвиняю себя во всём плохом, что происходит.`]},{options:[`У меня нет мыслей о том, чтобы покончить с собой.`,`У меня есть мысли о самоубийстве, но я не стал бы их осуществлять.`,`Я хотел бы покончить с собой.`,`Я покончил бы с собой, если бы представилась возможность.`]},{options:[`Я плачу не больше, чем обычно.`,`Я плачу чаще, чем раньше.`,`Я плачу по любому поводу.`,`Мне хочется плакать, но я не могу.`]},{options:[`Я не более раздражителен, чем обычно.`,`Я легче раздражаюсь, чем раньше.`,`Я всё время раздражён.`,`Меня больше не раздражают вещи, которые раньше раздражали.`]},{options:[`Я не утратил интереса к другим людям.`,`Другие люди интересуют меня меньше, чем раньше.`,`Я в значительной степени утратил интерес к людям.`,`Я полностью утратил интерес к другим людям.`]},{options:[`Я принимаю решения так же легко, как и раньше.`,`Я чаще, чем раньше, откладываю принятие решений.`,`Мне значительно труднее принимать решения, чем раньше.`,`Я вообще не могу принимать решения.`]},{options:[`Я не чувствую, что выгляжу хуже, чем обычно.`,`Меня беспокоит, что я выгляжу старым или непривлекательным.`,`Я замечаю постоянные изменения во внешности, делающие меня непривлекательным.`,`Я считаю, что выгляжу уродливо.`]},{options:[`Я могу работать так же хорошо, как и раньше.`,`Мне нужно приложить дополнительное усилие, чтобы начать что-то делать.`,`Мне приходится заставлять себя делать что-либо.`,`Я совсем не могу работать.`]},{options:[`Я сплю так же хорошо, как обычно.`,`Я сплю несколько хуже, чем обычно.`,`Я сплю значительно хуже, чем обычно.`,`Я просыпаюсь на 1–2 часа раньше обычного и больше не могу заснуть.`]},{options:[`Я устаю не больше, чем обычно.`,`Я устаю быстрее, чем раньше.`,`Я устаю почти от всего, что де ь расслабиться.`,`Страх, что произойдёт худшее.`,`Головокружение или ощущение неустойчивости.`,`Учащённое сердцебиение.`,`Неустойчивость или шаткость.`,`Чувство ужаса.`,`Нервозность.`,`Ощущение удушья.`,`Дрожь в руках.`,`Дрожь во всём теле.`,`Страх потерять контроль.`,`Затруднённое дыхание.`,`Страх смерти.`,`Испуг.`,`Желудочно-кишечные расстройства.`,`Обморочное состояние или головокружение.`,`Прилив крови к лицу.`,`Усиленное потоотделение, не связанное с жарой.`],options:[{value:0,label:`Совсем не беспокоил`},{value:1,label:`Слегка беспокоил`},{value:2,label:`Умеренно беспокоил`},{value:3,label:`Сильно беспокоил`}],interpretation:[{min:0,max:7,label:`Минимальная тревога`,level:`low`},{min:8,max:15,label:`Лёгкая тревога`,level:`low`},{min:16,max:25,label:`Умеренная тревога`,level:`moderate`},{min:26,max:63,label:`Тяжёлая тревога`,level:`high`}]},{id:`hama`,category:`Тревога`,label:`Шкала тревоги Гамильтона (HAM-A)`,icon:`🩺`,badge:`14 пунктов, 0-4`,desc:`<strong>Клиницистская шкала</strong> для оценки выраженности психических и соматических симптомов тревоги.`,kind:`likert`,questions:[`Тревожное настроение: опасения, ожидание худшего, тревожные предчувствия, раздражительность.`,`Напряжение: чувство напряжённости, утомляемость, вздрагивания, плаксивость, невозможность расслабиться.`,`Страхи: темноты, незнакомцев, одиночества, животных, транспорта, толпы.`,`Бессонница: трудности засыпания, прерывистый сон, неудовлетворённость сном, усталость при пробуждении.`,`Интеллектуальные нарушения: трудность концентрации, ослабление памяти.`,`Депрессивное настроение: утрата интересов, отсутствие удовольствия, ранние пробуждения, суточные колебания настроения.`,`Соматические мышечные симптомы: боли, напряжение, скованность, подёргивания, скрежетание зубами, дрожь.`,`Соматические сенсорные симптомы: шум в ушах, затуманивание зрения, приливы жара или холода, слабость, покалывания.`,`Сердечно-сосудистые симптомы: тахикардия, сердцебиение, боли в груди, пульсация сосудов, чувство обморока.`,`Респираторные симптомы: чувство сдавления в груди, нехватка воздуха, вздохи, ощущение удушья.`,`Желудочно-кишечные симптомы: затруднение глотания, метеоризм, боль в животе, тошнота, рвота, снижение веса, запор.`,`Мочеполовые симптомы: учащённое мочеиспускание, императивные позывы, нарушения менструального цикла, снижение либидо.`,`Вегетативные симптомы: сухость во рту, покраснение или бледность, потливость, головокружение, головная боль, «гусиная кожа».`,`Поведение при беседе: беспокойство, напряжённая мимика, вздохи, учащённое дыхание, дрожь, расширенные зрачки.`],options:[{value:0,label:`Отсутствует`},{value:1,label:`Слабо выражено`},{value:2,label:`Умеренно выражено`},{value:3,label:`Сильно выражено`},{value:4,label:`Очень сильно выражено`}],interpretation:[{min:0,max:16,label:`Лёгкая тревога`,level:`low`},{min:17,max:24,label:`Умеренная тревога`,level:`moderate`},{min:25,max:56,label:`Тяжёлая тревога`,level:`high`}]}],h=[{id:`hcl33`,category:`Биполярный спектр`,label:`Опросник гипомании HCL-33`,icon:`⚡`,badge:`33 вопроса, Да/Нет`,desc:`<strong>Для кого:</strong> скрининг гипоманиакальных периодов в анамнезе.<br><strong>Инструкция:</strong> отмечайте состояния, которые отличались от обычного уровня и длились несколько дней.`,kind:`likert`,printable:!0,digitMin:0,digitMax:1,blankInstruction:`Отметьте «Да», если это было характерно для периода повышенного состояния; иначе — «Нет».`,questions:[`Мне нужно меньше сна.`,`Я чувствую больше энергии и активность повышена.`,`Я более уверен(а) в себе.`,`Я получаю больше удовольствия от работы.`,`Я более общителен(а) (больше телефонных звонков, больше встреч).`,`Мне хочется путешествовать и/или я действительно больше путешествую.`,`Я чаще веду себя рискованно при вождении.`,`Я трачу больше денег / делаю больше покупок.`,`В ежедневной деятельности я беру на себя больше рисков.`,`Я более физически активен(на).`,`У меня больше планов и идей.`,`У меня меньше застенчивости, я менее робок(а).`,`Я одеваюсь более ярко / экстравагантно / привлекаю больше внимания.`,`Я хочу встречаться с большим числом людей или действительно встречаюсь.`,`Я более заинтересован(а) в сексе и/или сексуально более активен(на).`,`Я чаще флиртую.`,`Я больше говорю.`,`Я думаю быстрее.`,`Я чаще шучу и каламбурю.`,`Я легко отвлекаюсь.`,`Я занимаюсь многими новыми делами.`,`Мои мысли скачут с одной темы на другую.`,`Я делаю всё гораздо быстрее и/или легче.`,`Я более нетерпелив(а) и/или раздражителен(на).`,`Я могу быть утомляющим(ей) или раздражающим(ей) для окружающих.`,`Я чаще конфликтую с окружающими.`,`Моё настроение выше, более оптимистично.`,`Я пью больше кофе / курю больше.`,`Я пью больше алкоголя.`,`Я принимаю больше лекарств / стимуляторов (в т.ч. без назначения).`,`Я играю больше (азартные игры, лотереи и т.п.).`,`Я больше ем / или наоборот — аппетит снижен.`,`Другие замечают, что я «не такой(ая), как обычно» / «на подъёме».`],options:[{value:1,label:`Да`},{value:0,label:`Нет`}],interpretation:[{min:0,max:13,label:`низкая вероятность гипоманиакальных эпизодов`,level:`low`},{min:14,max:33,label:`возможны гипоманиакальные эпизоды — нужна клиническая оценка`,level:`high`}]},{id:`mdq`,category:`Биполярный спектр`,label:`Опросник настроения MDQ`,icon:`🧬`,badge:`13+2, Да/Нет`,desc:`<strong>Скрининг биполярного спектра.</strong> Вопросы 1–13 — симптомы; в строке ответов: 13 цифр по симптомам, затем 14-я — «несколько симптомов одновременно» (1=да), 15-я — выраженность проблем (0=нет, 1=незначительные, 2=умеренные, 3=серьёзные). Для простого суммарного скрининга считаются первые 13.`,kind:`likert`,printable:!0,digitMin:0,digitMax:3,blankInstruction:`Пункты 1–14: отметьте Нет или Да. Пункт 15: насколько эти симптомы создавали проблемы — 0 нет; 1 незначительные; 2 умеренные; 3 серьёзные.`,questions:[`Были ли периоды, когда вы чувствовали себя настолько хорошо или возбуждённо, что другие считали это необычным, или вы были настолько возбуждены, что попадали в неприятности?`,`Были ли периоды, когда вы были настолько р ,`Недооценка Ваших достижений другими.`,`Ощущение одиночества даже в обществе.`,`Такое беспокойство, что Вы не можете усидеть на месте.`,`Ощущение собственной никчёмности.`,`Ощущение, что с Вами случится что-то плохое.`,`Крики или швыряние вещей.`,`Страх упасть в обморок на людях.`,`Ощущение, что люди используют Вас, если Вы позволите.`,`Мысли сексуального характера, которые сильно беспокоят.`,`Мысль, что Вас следует наказать за грехи.`,`Кошмарные сновидения.`,`Мысль, что с Вашим телом что-то серьёзно не так.`,`Никогда не испытывать чувства близости к другому человеку.`,`Чувство вины.`,`Мысль, что с Вашим рассудком что-то не в порядке.`],score:le},{id:`bpi`,category:`Личностные`,label:`BPI (пограничные черты)`,icon:`◫`,badge:`53 пункта, Да/Нет`,desc:`Скрининговый опросник пограничной организации личности. Не является диагнозом.`,kind:`likert`,options:Ne,digitMin:0,digitMax:1,printable:!0,questions:[`Моё настроение часто меняется без понятной причины.`,`Я боюсь, что близкие люди могут меня оставить.`,`Когда важный для меня человек отдаляется, я чувствую сильную панику.`,`Мои отношения часто переходят от идеализации к глубокому разочарованию.`,`Мне трудно понять, кто я на самом деле.`,`Мои цели, ценности или планы на будущее часто резко меняются.`,`Иногда я совершаю поступки, о которых потом жалею.`,`Я склонен(на) тратить деньги импульсивно.`,`Я рисковал(а) собой, чтобы избавиться от невыносимых чувств.`,`У меня бывали намеренные самоповреждения.`,`У меня бывали мысли о самоубийстве или попытки суицида.`,`Я часто чувствую внутреннюю пустоту.`,`Мне трудно контролировать сильный гнев.`,`Я часто срываюсь на других, а потом испытываю вину.`,`В стрессе я могу чувствовать себя нереальным(ой) или оторванным(ой) от себя.`,`В сильном стрессе мне кажется, что другие хотят причинить мне вред.`,`Моё мнение о себе легко меняется под влиянием других.`,`Я часто не уверен(а), люблю ли близкого человека или ненавижу его.`,`Мне трудно переносить одиночество.`,`Я часто проверяю, действи
