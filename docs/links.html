<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МЕТР — навигация</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0b18;
        --bg-card: rgba(255, 255, 255, 0.04);
        --bg-card-hover: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f4f0ff;
        --muted: #a89bc4;
        --accent: #863bff;
        --accent-soft: #b794ff;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Manrope', system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(ellipse 80% 60% at 50% -10%, rgba(134, 59, 255, 0.35), transparent),
          radial-gradient(ellipse 50% 40% at 100% 100%, rgba(71, 191, 255, 0.12), transparent),
          var(--bg);
      }

      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 2.5rem;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 0.15rem 0 0;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .links {
        display: grid;
        gap: 0.85rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .link-card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.1rem 1.15rem;
        box-shadow: var(--shadow);
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .link-card:hover {
        background: var(--bg-card-hover);
        border-color: rgba(134, 59, 255, 0.45);
        transform: translateY(-2px);
      }

      .link-card:focus-visible {
        outline: 2px solid var(--accent-soft);
        outline-offset: 3px;
      }

      .link-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .link-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
      }

      .link-desc {
        margin: 0.35rem 0 0;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--muted);
      }

      .link-arrow {
        flex-shrink: 0;
        margin-top: 0.1rem;
        color: var(--accent-soft);
        font-size: 1.1rem;
        transition: transform 0.2s ease;
      }

      .link-card:hover .link-arrow {
        transform: translate(3px, -3px);
      }

      .hint {
        margin-top: 2rem;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        border: 1px dashed var(--border);
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .hint code {
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        color: var(--accent-soft);
      }

      @media (max-width: 480px) {
        .page {
          padding-top: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <img src="favicon.svg" alt="" width="42" height="42" />
        <div>
          <h1>МЕТР</h1>
          <p>Быстрые ссылки на материалы и инструменты</p>
        </div>
      </header>

      <ul class="links" id="links"></ul>

      <p class="hint">
        Чтобы добавить ссылку, откройте <code>docs/links.html</code> и допишите объект в массив
        <code>LINKS</code> внизу файла.
      </p>
    </main>

    <script>
      // ── Добавляйте новые ссылки сюда ──────────────────────────────────────
      const LINKS = [
        {
          title: 'Библиотека методик',
          description: 'Книги и оригинальные описания тестов (раздел сексологии).',
          url: 'https://dockavetski.github.io/Books/pages/#s2',
        },
        {
          title: 'МЕТР — шкалы и бланки',
          description: 'Онлайн-опросники, расчёт результатов и бланки для печати.',
          url: 'https://dockavetski.github.io/metr-cabinet/',
        },
      ]
      // ─────────────────────────────────────────────────────────────────────

      const list = document.getElementById('links')

      for (const { title, description, url } of LINKS) {
        const li = document.createElement('li')
        li.innerHTML = `
          <a class="link-card" href="${url}" target="_blank" rel="noopener noreferrer">
            <div class="link-top">
              <div>
                <h2 class="link-title">${title}</h2>
                <p class="link-desc">${description}</p>
              </div>
              <span class="link-arrow" aria-hidden="true">↗</span>
            </div>
          </a>
        `
        list.appendChild(li)
      }
    </script>
  </body>
</html>
