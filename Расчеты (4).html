<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психологические тесты — профессиональный инструмент</title>
<style>
:root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2333;
    --card: #1c2333;
    --border: #30363d;
    --text: #f0f6fc;
    --text2: #8b949e;
    --primary: #58a6ff;
    --primary-dark: #1f6feb;
    --accent: #f0883e;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --shadow: rgba(0,0,0,0.4);
}
[data-theme="light"] {
    --bg: #eef4f9;
    --bg2: #f0f4f8;
    --bg3: #e8edf3;
    --card: #ffffff;
    --border: #d0d7de;
    --text: #1f2937;
    --text2: #4a6a8a;
    --primary: #1f4e6e;
    --primary-dark: #123a52;
    --accent: #ffb74d;
    --success: #2ea043;
    --danger: #cf222e;
    --warning: #9a6700;
    --shadow: rgba(0,0,0,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; transition:background .3s,color .3s; }
.app { display:flex; flex:1; overflow:hidden; }
.sidebar { width:280px; background:var(--bg2); border-right:1px solid var(--border); padding:1rem 0; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; }
.sidebar-brand { font-size:1.2rem; font-weight:700; padding:0.5rem 1.5rem 1rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.sidebar-category { padding:0.5rem 1.5rem; font-weight:600; color:var(--text2); font-size:.7rem; text-transform:uppercase; margin-top:.5rem; letter-spacing:.5px; }
.sidebar-item { padding:.4rem 1.5rem .4rem 2rem; cursor:pointer; transition:.15s; border-left:3px solid transparent; font-size:.9rem; color:var(--text2); }
.sidebar-item:hover { background:var(--bg3); color:var(--text); }
.sidebar-item.active { background:var(--bg3); border-left-color:var(--accent); color:var(--text); }
.main { flex:1; overflow-y:auto; padding:1.5rem 2rem; background:var(--bg); }
.main-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:10px; }
.main-header .title { font-size:1.4rem; font-weight:600; }
.main-header .controls { display:flex; gap:8px; flex-wrap:wrap; }
.test-title { font-size:1.3rem; font-weight:600; color:var(--text); margin-bottom:.5rem; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.test-title .badge { font-size:.7rem; background:var(--bg3); padding:.2rem .7rem; border-radius:20px; font-weight:400; color:var(--text2); }
.test-desc { color:var(--text2); margin-bottom:1rem; font-size:.95rem; line-height:1.5; }
.test-desc strong { color:var(--text); }
.question-row { display:flex; flex-wrap:wrap; align-items:center; background:var(--card); padding:.5rem .8rem; border-radius:.8rem; border:1px solid var(--border); margin-bottom:.3rem; gap:.5rem 1rem; transition:background .1s; }
.question-row:hover { background:var(--bg3); }
.question-row .q-label { flex:1 1 200px; font-size:.9rem; font-weight:500; color:var(--text); }
.question-row .q-label .q-num { color:var(--text2); font-weight:400; margin-right:4px; }
.string-input-group { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:1rem; }
.string-input-group input { flex:2; min-width:200px; padding:8px 14px; border-radius:2rem; border:2px solid var(--border); font-size:1rem; font-family:monospace; background:var(--card); color:var(--text); transition:border-color .2s; }
.string-input-group input:focus { outline:none; border-color:var(--primary); }
.string-input-group input.error { border-color:var(--danger); background:rgba(248,81,73,0.1); }
.string-input-group input.valid { border-color:var(--success); background:rgba(63,185,80,0.1); }
.string-input-group .counter { font-size:.85rem; color:var(--text2); white-space:nowrap; }
.string-input-group .counter.error { color:var(--danger); font-weight:600; }
.string-input-group .counter.valid { color:var(--success); font-weight:600; }
.string-input-group .hint { font-size:.8rem; color:var(--text2); font-family:monospace; }
.radio-group { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; flex:0 1 auto; }
.radio-group label { display:flex; align-items:center; gap:3px; font-size:.8rem; cursor:pointer; padding:2px 6px; border-radius:4px; transition:background .1s; color:var(--text2); }
.radio-group label:hover { background:var(--bg3); color:var(--text); }
.radio-group label.selected { color:var(--text); background:var(--bg3); }
.radio-group input[type="radio"] { margin:0; cursor:pointer; width:16px; height:16px; accent-color:var(--primary); }
.hads-vertical .question-row { flex-direction:column; align-items:stretch; }
.hads-vertical .q-label { flex:1 1 auto; margin-bottom:4px; }
.hads-vertical .radio-group { justify-content:flex-start; flex-direction:column; align-items:stretch; gap:2px; }
.hads-vertical .radio-group label { padding:3px 8px; border-radius:4px; border:1px solid transparent; transition:all .15s; }
.hads-vertical .radio-group label:hover { background:var(--bg3); border-color:var(--border); }
.hads-vertical .radio-group label.selected { background:var(--bg3); border-color:var(--primary); }
.btn { background:var(--primary); color:#fff; border:none; padding:.4rem 1.2rem; border-radius:2rem; font-weight:600; font-size:.85rem; cursor:pointer; transition:.2s; }
.btn:hover { transform:scale(1.02); opacity:.9; }
.btn-secondary { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { background:var(--border); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#d63a3a; }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { background:#2ea043; }
.result-area { margin-top:1rem; background:var(--bg2); border-radius:1rem; padding:.8rem 1.2rem; border-left:4px solid var(--accent); min-height:3rem; font-size:.95rem; line-height:1.6; color:var(--text); }
.result-area strong { color:var(--text); }
.result-area .sub-result { margin:.2rem 0; padding-left:1rem; border-left:2px solid var(--border); }
.result-area .level-low { color:var(--success); }
.result-area .level-moderate { color:var(--warning); }
.result-area .level-high { color:var(--danger); }
.global-result { background:var(--bg2); border-top:2px solid var(--border); padding:1rem 2rem; margin-top:1rem; }
.global-result h3 { font-size:1.1rem; margin-bottom:.5rem; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.global-result textarea { width:100%; min-height:150px; padding:.8rem; border-radius:1rem; border:1px solid var(--border); font-family:'Courier New',monospace; font-size:.9rem; background:var(--card); color:var(--text); resize:vertical; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--bg2); color:var(--text); padding:8px 20px; border-radius:40px; font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; border:1px solid var(--border); }
@media (max-width:700px) {
 .app { flex-direction:column; }
 .sidebar { width:100%; flex-direction:row; flex-wrap:wrap; max-height:200px; overflow-y:auto; padding:.5rem; border-right:none; border-bottom:1px solid var(--border); }
 .sidebar-brand, .sidebar-category { display:none; }
 .sidebar-item { padding:.2rem .8rem; font-size:.8rem; border-left:none; border-bottom:2px solid transparent; }
 .sidebar-item.active { border-bottom-color:var(--accent); border-left:none; }
 .main { padding:.5rem; }
 .question-row .q-label { flex:1 1 100%; }
 .radio-group { justify-content:flex-start; }
 .main-header { flex-direction:column; align-items:stretch; }
 .hads-vertical .radio-group { flex-direction:column; }
}
</style>
</head>
<body>
<div class="app">
 <div class="sidebar" id="sidebar">
  <div class="sidebar-brand">🧠 Психологические тесты</div>
  <div id="menuContainer"></div>
 </div>
 <div class="main" id="mainContent">
  <div class="main-header">
   <span class="title" id="currentTestTitle">Выберите тест</span>
   <div class="controls">
    <button class="btn btn-secondary" id="themeToggle" title="Переключить тему">🌙</button>
    <button class="btn btn-secondary" id="modeToggle" title="Переключить режим ввода">📝 Ввод строкой</button>
   </div>
  </div>
  <div id="testContainer"></div>
  <div class="global-result">
   <h3>📋 Сводка результатов <button class="btn btn-secondary" id="copyGlobalBtn">Копировать всё</button> <button class="btn btn-danger" id="clearGlobalBtn">Очистить все</button></h3>
   <textarea id="globalOutput" readonly placeholder="Здесь появятся результаты..."></textarea>
  </div>
 </div>
</div>
<div id="toast" class="toast"></div>
<script>
// =============================================================
// 1. ДВИЖОК (Engine) — исправлены HADS и SCL-90
// =============================================================
const Engine = {
    answers: {},
    globalResults: [],
    currentTestId: 'bdi',
    inputMode: 'string',
    theme: 'dark',

    init() {
        this.loadState();
        this.applyTheme();
        this.buildMenu();
        this.loadTest('bdi');
        this.setupGlobalButtons();
        this.setupThemeToggle();
        this.setupModeToggle();
        this.showToast('Выберите тест слева');
    },

    saveState() {
        try {
            localStorage.setItem('psych_tests_state', JSON.stringify({
                answers: this.answers,
                globalResults: this.globalResults,
                inputMode: this.inputMode,
                theme: this.theme
            }));
        } catch(e) {}
    },

    loadState() {
        try {
            const data = localStorage.getItem('psych_tests_state');
            if (data) {
                const state = JSON.parse(data);
                this.answers = state.answers || {};
                this.globalResults = state.globalResults || [];
                this.inputMode = state.inputMode || 'string';
                this.theme = state.theme || 'dark';
            }
        } catch(e) {}
    },

    applyTheme() {
        document.documentElement.setAttribute('data-theme', this.theme);
        document.getElementById('themeToggle').textContent = this.theme === 'dark' ? '🌙' : '☀️';
    },

    toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        this.applyTheme();
        this.saveState();
    },

    setupThemeToggle() {
        document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
    },

    setupModeToggle() {
        const btn = document.getElementById('modeToggle');
        btn.textContent = this.inputMode === 'string' ? '📝 Ввод строкой' : '☑️ Выбор вариантов';
        btn.addEventListener('click', () => {
            this.inputMode = this.inputMode === 'string' ? 'radio' : 'string';
            btn.textContent = this.inputMode === 'string' ? '📝 Ввод строкой' : '☑️ Выбор вариантов';
            this.saveState();
            this.loadTest(this.currentTestId);
            this.showToast(`Режим: ${this.inputMode === 'string' ? 'ввод строкой' : 'выбор вариантов'}`);
        });
    },

    buildMenu() {
        const container = document.getElementById('menuContainer');
        const cats = {};
        Object.keys(testCategories).forEach(id => {
            const cat = testCategories[id];
            if (!cats[cat]) cats[cat] = [];
            cats[cat].push({ id, label: testLabels[id] || id });
        });
        let html = '';
        const sorted = Object.keys(cats).sort((a,b) => {
            const ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
            if (ia === -1 && ib === -1) return a.localeCompare(b);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
        });
        sorted.forEach(cat => {
            html += `<div class="sidebar-category">${cat}</div>`;
            cats[cat].sort((a,b) => a.label.localeCompare(b.label));
            cats[cat].forEach(t => {
                html += `<div class="sidebar-item" data-test="${t.id}">${t.label}</div>`;
            });
        });
        container.innerHTML = html;
        container.querySelectorAll('.sidebar-item').forEach(el => {
            el.addEventListener('click', () => this.loadTest(el.dataset.test));
        });
    },

    loadTest(testId) {
        const config = testConfigs[testId];
        if (!config) {
            document.getElementById('testContainer').innerHTML = `<p style="color:var(--danger);">Тест не найден</p>`;
            return;
        }
        this.currentTestId = testId;
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.sidebar-item[data-test="${testId}"]`)?.classList.add('active');
        document.getElementById('currentTestTitle').textContent = config.label;

        const container = document.getElementById('testContainer');
        container.innerHTML = '';
        this.renderTest(config, container);
    },

    renderTest(config, container) {
        const mode = this.inputMode;
        const isString = mode === 'string';

        let html = `<div class="test-title">${config.icon || '📋'} ${config.label}`;
        if (config.badge) html += ` <span class="badge">${config.badge}</span>`;
        html += `</div>`;
        if (config.desc) html += `<div class="test-desc">${config.desc}</div>`;

        const count = config.questions ? config.questions.length : 0;
        const saved = this.answers[config.id] || '';

        if (config.id === 'bdi') {
            if (isString) {
                html += this.renderBdiInput(config);
            } else {
                html += this.renderBdiRadioSimple(config);
            }
        } else if (config.id === 'asq') {
            html += this.renderAsqContent(config);
        } else if (config.id === 'scl90') {
            html += this.renderScl90Content(config, isString);
        } else if (config.id === 'hads') {
            html += this.renderHads(config, isString);
        } else if (isString && config.type !== 'text-input' && count > 0) {
            html += this.renderStringInput(config, count, saved);
        } else if (config.type === 'text-input') {
            html += this.renderTextInput(config);
        } else {
            html += this.renderRadioQuestions(config);
        }

        html += `<div style="margin-top:1rem;">`;
        html += `<button class="btn" id="calcBtn">Рассчитать</button>`;
        html += `<button class="btn btn-danger" id="clearBtn">Очистить</button>`;
        html += `</div>`;
        html += `<div class="result-area" id="resultArea">Ожидание расчёта</div>`;

        container.innerHTML = html;

        const calcBtn = document.getElementById('calcBtn');
        const clearBtn = document.getElementById('clearBtn');
        if (calcBtn) calcBtn.addEventListener('click', () => this.calculateTest(config));
        if (clearBtn) clearBtn.addEventListener('click', () => this.clearTest(config));

        this.setupInputHandlers(config);
    },

    // ---- BDI ----
    renderBdiInput(config) {
        const saved = this.answers[config.id] || '';
        return `
            <div class="string-input-group">
                <input type="text" id="stringInput" placeholder="21 цифра (0-3)..." value="${saved}" />
                <span class="counter" id="stringCounter">${saved.length} / 21</span>
                <span class="hint">Пример: 000000000000000000000</span>
            </div>
        `;
    },

    renderBdiRadioSimple(config) {
        const saved = this.answers[config.id] || {};
        const bdiQuestions = [
            'Настроение', 'Пессимизм', 'Чувство несостоятельности', 'Неудовлетворенность',
            'Чувство вины', 'Ощущение, что буду наказан', 'Отвращение к себе', 'Идеи самообвинения',
            'Суицидальные мысли', 'Слезливость', 'Раздражительность', 'Нарушение социальных связей',
            'Нерешительность', 'Образ тела', 'Утрата трудоспособности', 'Нарушение сна',
            'Утомляемость', 'Снижение аппетита', 'Потеря веса', 'Охваченность телесными ощущениями',
            'Утрата либидо'
        ];
        let html = `<div id="itemsContainer">`;
        bdiQuestions.forEach((text, idx) => {
            html += `<div class="question-row"><div class="q-label"><span class="q-num">${idx+1}.</span> ${text}</div><div class="radio-group">`;
            for (let v = 0; v <= 3; v++) {
                const checked = saved[idx] === v ? 'checked' : '';
                html += `<label><input type="radio" name="q_${idx}" value="${v}" ${checked}> ${v}</label>`;
            }
            html += `</div></div>`;
        });
        html += `</div>`;
        return html;
    },

    // ---- ASQ ----
    renderAsqContent(config) {
        const saved = this.answers['asq'] || {};
        const isString = this.inputMode === 'string';
        const showQ5 = saved.anyYes || false;
        const q5Answer = saved.q5 || '0';
        const comment = saved.comment || '';

        let html = `<div id="asqItems">`;
        const asqQuestions = [
            'За последние несколько недель хотелось ли Вам умереть?',
            'За последние несколько недель чувствовали ли Вы, что Вам или Вашей семье было бы лучше, если бы Вы умерли?',
            'За последнюю неделю были ли у Вас мысли о самоубийстве?',
            'Вы когда-нибудь пытались убить себя?'
        ];
        asqQuestions.forEach((text, idx) => {
            const val = saved[idx] !== undefined ? saved[idx] : '';
            html += `<div class="question-row"><div class="q-label"><span class="q-num">${idx+1}.</span> ${text}</div><div class="radio-group">`;
            if (isString) {
                html += `<label><input type="radio" name="asq_${idx}" value="1" ${val === 1 ? 'checked' : ''}> 1 (Да)</label>`;
                html += `<label><input type="radio" name="asq_${idx}" value="0" ${val === 0 ? 'checked' : ''}> 0 (Нет)</label>`;
            } else {
                html += `<label><input type="radio" name="asq_${idx}" value="1" ${val === 1 ? 'checked' : ''}> Да</label>`;
                html += `<label><input type="radio" name="asq_${idx}" value="0" ${val === 0 ? 'checked' : ''}> Нет</label>`;
            }
            html += `</div></div>`;
        });
        html += `</div>`;

        html += `<div id="asqQuestion5" style="${showQ5 ? 'display:block;' : 'display:none;'} margin-top:10px; padding:12px; background:var(--bg3); border-radius:1rem; border:1px solid var(--accent);">`;
        html += `<div class="question-row"><div class="q-label"><span class="q-num">5.</span> Думаете ли Вы о том, чтобы убить себя прямо сейчас?</div><div class="radio-group">`;
        if (isString) {
            html += `<label><input type="radio" name="asq_q5" value="1" ${q5Answer === '1' ? 'checked' : ''}> 1 (Да)</label>`;
            html += `<label><input type="radio" name="asq_q5" value="0" ${q5Answer === '0' ? 'checked' : ''}> 0 (Нет)</label>`;
        } else {
            html += `<label><input type="radio" name="asq_q5" value="1" ${q5Answer === '1' ? 'checked' : ''}> Да</label>`;
            html += `<label><input type="radio" name="asq_q5" value="0" ${q5Answer === '0' ? 'checked' : ''}> Нет</label>`;
        }
        html += `</div></div>`;
        html += `<div style="margin-top:5px;">`;
        html += `<label style="font-size:.9rem;color:var(--text2);">Если да, опишите, пожалуйста, свои мысли:</label>`;
        html += `<textarea id="asqComment" rows="4" style="width:100%;border-radius:.8rem;border:1px solid var(--border);padding:.5rem;font-family:inherit;background:var(--card);color:var(--text);margin-top:4px;">${comment}</textarea>`;
        html += `</div></div>`;
        return html;
    },

    // ---- HADS (исправлен: сначала тревога, потом депрессия) ----
    renderHads(config, isString) {
        const saved = this.answers['hads'] || {};
        const anxietyQuestions = [
            'Я испытываю напряжение, мне не по себе',
            'Я испытываю страх, кажется, будто что-то ужасное может вот-вот случиться',
            'Беспокойные мысли крутятся у меня в голове',
            'Я легко могу сесть и расслабиться',
            'Я испытываю внутреннее напряжение или дрожь',
            'Я испытываю неусидчивость, мне постоянно нужно двигаться',
            'У меня бывает внезапное чувство паники'
        ];
        const depressionQuestions = [
            'То, что приносило мне большое удовольствие, и сейчас вызывает у меня такое же чувство',
            'Я способен рассмеяться и увидеть в том или ином событии смешное',
            'Я испытываю бодрость',
            'Мне кажется, что я стал все делать очень медленно',
            'Я не слежу за своей внешностью',
            'Я считаю, что мои дела могут принести мне чувство удовлетворения',
            'Я могу получить удовольствие от хорошей книги, радио- или телепрограммы'
        ];

        let html = `<div class="hads-vertical" style="display:flex;flex-wrap:wrap;gap:2rem;">`;

        // Блок тревоги
        html += `<div style="flex:1;min-width:280px;"><h3 style="color:var(--text);margin-bottom:.5rem;">Тревога</h3>`;
        if (isString) {
            html += `<div class="string-input-group" style="margin-bottom:.5rem;">
                <input type="text" id="hads_anxiety_input" placeholder="7 цифр (0-3)..." value="${saved.anxiety || ''}" />
                <span class="counter" id="hads_anxiety_counter">${(saved.anxiety || '').length} / 7</span>
            </div>`;
        } else {
            anxietyQuestions.forEach((text, idx) => {
                html += `<div class="question-row"><div class="q-label"><span class="q-num">${idx+1}.</span> ${text}</div><div class="radio-group">`;
                for (let v = 0; v <= 3; v++) {
                    const checked = saved.anxiety && saved.anxiety[idx] === v ? 'checked' : '';
                    html += `<label><input type="radio" name="hads_a_${idx}" value="${v}" ${checked}> ${v}</label>`;
                }
                html += `</div></div>`;
            });
        }
        html += `</div>`;

        // Блок депрессии
        html += `<div style="flex:1;min-width:280px;"><h3 style="color:var(--text);margin-bottom:.5rem;">Депрессия</h3>`;
        if (isString) {
            html += `<div class="string-input-group" style="margin-bottom:.5rem;">
                <input type="text" id="hads_depression_input" placeholder="7 цифр (0-3)..." value="${saved.depression || ''}" />

            </div>`;

                html += `<div class="question-row"><div class="q-label"><span class="q-num">${idx+1}.</span> ${text}</div><div class="radio-group">`;

        </div>`;

    },

    renderStringInput(config, count, saved) {

        return `
            <div class="string-input-group">
                <input type="text" id="stringInput" placeholder="Введите ${count} цифр (${minVal}-${maxVal})..." value="${saved}" />

    getMaxOptionValue(options) {
        if (!options || !options.length) return 0;
        if (typeof options[0] === 'object') {
            return Math.max(...options.map(o => o.value));
        }
        return Math.max(...options);
    },

    renderRadioQuestions(config) {
        const saved = this.answers[config.id] || {};

                const val = typeof opt === 'object' ? opt.value : opt;
                const label = typeof opt === 'object' ? opt.label : String(opt);
                const checked = saved[idx] === val ? 'checked' : '';
                html += `<label><input type="radio" name="q_${idx}" value="${val}" ${checked}> ${label}</label>`;

                        this.calculateTest(config);

                });

    calculateTest(config) {
        if (!config) return;
        const isString = this.inputMode === 'string';

        // BDI
        if (config.id === 'bdi') {
            if (isString) {
                const input = document.getElementById('stringInput');
                if (!input) return;
                const raw = input.value.trim();
                if (raw.length !== 21) {
                    this.showResult(config, `Ожидается 21 цифра (получено ${raw.length})`);
                    return;
                }
                const nums = raw.split('').map(Number);
                if (nums.some(v => v < 0 || v > 3)) {
                    this.showResult(config, 'Цифры должны быть от 0 до 3');
                    return;
                }
                const total = nums.reduce((a,b) => a+b, 0);
                const result = this.interpretScore(config, total);
                this.answers[config.id] = raw;
                this.saveState();
                this.showResult(config, result, total);
                this.updateGlobalResult(config.id, config.label, result);
            } else {
                let sum = 0;
                for (let i = 0; i < 21; i++) {
                    const val = this.getRadioValue(`q_${i}`);
                    sum += val;
                    this.answers[config.id] = this.answers[config.id] || {};
                    this.answers[config.id][i] = val;
                }
                this.saveState();
                const result = this.interpretScore(config, sum);
                this.showResult(config, result, sum);
                this.updateGlobalResult(config.id, config.label, result);
            }
            return;
        }

        // ASQ
        if (config.id === 'asq') {
            let anyYes = false;
            for (let i = 0; i < 4; i++) {
                const val = this.getRadioValue(`asq_${i}`);
                if (val === 1) anyYes = true;
                this.answers['asq'] = this.answers['asq'] || {};
                this.answers['asq'][i] = val;
            }
            const q5 = this.getRadioValueStr('asq_q5') || '0';
            const comment = document.getElementById('asqComment')?.value || '';
            this.answers['asq'].q5 = q5;
            this.answers['asq'].comment = comment;
            this.saveState();

            let resultText = '';
            if (!anyYes) {
                resultText = 'Риск суицида не выявлен (все ответы "Нет").';
            } else {
                if (q5 === '1') {
                    resultText = 'ОСТРЫЙ СУИЦИДАЛЬНЫЙ РИСК! Требуется немедленное вмешательство!';
                    if (comment) resultText += `\nКомментарий: ${comment}`;
                } else {
                    resultText = 'Выявлен риск суицида (положительный ответ на один из скрининговых вопросов). Рекомендована консультация психиатра/психотерапевта.';
                    if (comment) resultText += `\nПримечание: ${comment}`;
                }
            }
            this.showResult(config, resultText);
            this.updateGlobalResult(config.id, config.label, resultText);
            return;
        }

        // HADS (исправлен: сначала тревога, потом депрессия)
        if (config.id === 'hads') {
            let anxiety = 0, depression = 0;
            const saved = this.answers['hads'] || {};

            if (isString) {
                const anxietyInput = document.getElementById('hads_anxiety_input');
                const depressionInput = document.getElementById('hads_depression_input');
                if (!anxietyInput || !depressionInput) return;
                const aRaw = anxietyInput.value.trim();
                const dRaw = depressionInput.value.trim();
                if (aRaw.length !== 7 || dRaw.length !== 7) {
                    this.showResult(config, 'Для каждой части нужно 7 цифр');
                    return;
                }
                const aNums = aRaw.split('').map(Number);
                const dNums = dRaw.split('').map(Number);
                if (aNums.some(v => v < 0 || v > 3) || dNums.some(v => v < 0 || v > 3)) {
                    this.showResult(config, 'Цифры должны быть от 0 до 3');
                    return;
                }
                anxiety = aNums.reduce((a,b) => a+b, 0);
                depression = dNums.reduce((a,b) => a+b, 0);
                this.answers['hads'] = { anxiety: aRaw, depression: dRaw };
                this.saveState();
            } else {
                for (let i = 0; i < 7; i++) {
                    anxiety += this.getRadioValue(`hads_a_${i}`);
                    depression += this.getRadioValue(`hads_d_${i}`);
                }
                this.answers['hads'] = { anxiety: anxiety, depression: depression };
                this.saveState();
            }

            let aLevel = '', dLevel = '';
            if (anxiety <= 7) aLevel = 'норма';
            else if (anxiety <= 10) aLevel = 'субклиническая тревога';
            else aLevel = 'клиническая тревога';
            if (depression <= 7) dLevel = 'норма';
            else if (depression <= 10) dLevel = 'субклиническая депрессия';
            else dLevel = 'клиническая депрессия';
            const result = `Тревога: ${anxiety} (${aLevel}), Депрессия: ${depression} (${dLevel})`;
            this.showResult(config, result);
            this.updateGlobalResult(config.id, config.label, result);
            return;
        }

        // SCL-90 (исправлены ключи шкал)
        if (config.id === 'scl90') {
            const count = 90;
            let scores = [];
            if (isString) {
                const input = document.getElementById('stringInput');
                if (!input) return;
                const raw = input.value.trim();
                if (raw.length !== count) {
                    this.showResult(config, `Ожидается ${count} цифр (получено ${raw.length})`);
                    return;
                }
                scores = raw.split('').map(Number);
                if (scores.some(v => v < 1 || v > 5)) {
                    this.showResult(config, 'Цифры должны быть от 1 до 5');
                    return;
                }
                this.answers['scl90'] = { _string: raw };
                this.saveState();
            } else {
                for (let i = 0; i < count; i++) {
                    const val = this.getRadioValue(`q_${i}`);
                    scores.push(val);
                    this.answers['scl90'] = this.answers['scl90'] || {};
                    this.answers['scl90'][i] = val;
                }
                this.saveState();
            }

            // Правильные ключи шкал SCL-90 (индексы от 0)
            const sclKeys = {
                som: [0,3,11,26,39,41,48,51,55,56,57,58],
                oc: [2,8,9,27,37,44,45,50,54,64],
                int: [5,20,28,33,35,36,60,68,69],
                dep: [4,13,14,21,29,30,31,32,53,59,70,76,78,79,88],
                anx: [1,16,22,23,38,46,47,61,71,72],
                hos: [10,23,24,62,66,73,80],
                phob: [12,24,42,46,49,64,69,74,81],
                par: [7,17,18,42,43,65,74,82],
                psy: [6,15,34,40,42,61,67,75,83,84,89]
            };
            const scaleNamesRu = {
                som: 'Соматизация (СОМ)',
                oc: 'Обсессивно-компульсивные (ОК)',
                int: 'Межличностная сенситивность (МС)',
                dep: 'Депрессия (ДЕП)',
                anx: 'Тревога (ТР)',
                hos: 'Враждебность (ВР)',
                phob: 'Фобическая тревога (ФТ)',
                par: 'Параноидные идеи (ПИ)',
                psy: 'Психотизм (ПС)'
            };

            const scaleSums = {};
            for (let key in sclKeys) {
                let sum = 0;
                sclKeys[key].forEach(idx => { sum += scores[idx] || 0; });
                scaleSums[key] = sum;
            }

            const totalSum = scores.reduce((a,b) => a+b, 0);
            const gsi = (totalSum / count).toFixed(2);
            const pst = scores.filter(s => s >= 3).length;
            const psdi = pst > 0 ? (totalSum / pst).toFixed(2) : 0;

            let resultHtml = `<div><strong>Глобальные индексы:</strong></div>`;
            resultHtml += `<div>GSI (общий индекс тяжести): ${gsi}</div>`;
            resultHtml += `<div>PST (количество симптомов ≥3): ${pst} из 90</div>`;
            resultHtml += `<div>PSDI (индекс дистресса): ${psdi}</div>`;
            resultHtml += `<br><div><strong>Баллы по шкалам (сырые / средний):</strong></div>`;

            let overallLevel = '';
            if (gsi < 2.0) overallLevel = 'Норма (низкий уровень дистресса)';
            else if (gsi < 3.0) overallLevel = 'Умеренный дистресс';
            else overallLevel = 'Высокий дистресс';

            let scaleResults = [];
            for (let key in scaleSums) {
                const countQ = sclKeys[key].length;
                const avg = (scaleSums[key] / countQ).toFixed(2);
                let level = '';
                if (avg < 2.0) level = 'низкий';
                else if (avg < 3.0) level = 'умеренный';
                else level = 'высокий';
                scaleResults.push(`${scaleNamesRu[key]}: ${scaleSums[key]} (ср. ${avg}) — ${level}`);
            }
            resultHtml += scaleResults.map(s => `<div class="sub-result">${s}</div>`).join('');
            resultHtml += `<br><div><strong>Общий уровень: ${overallLevel}</strong></div>`;

            this.showResult(config, resultHtml);
            this.updateGlobalResult('scl90', config.label, `GSI: ${gsi}, PST: ${pst}, PSDI: ${psdi}, ${overallLevel}`);
            return;
        }

        // Остальные тесты
        const count = config.questions ? config.questions.length : 0;

        if (isString && config.type !== 'text-input' && count > 0) {
            const input = document.getElementById('stringInput');
            if (!input) return;
            const raw = input.value.trim();
            if (raw.length !== count) {
                this.showResult(config, `Ожидается ${count} цифр (получено ${raw.length})`);
                return;
            }
            const nums = raw.split('').map(Number);
            const maxVal = config.options ? this.getMaxOptionValue(config.options) : 0;
            if (nums.some(v => v < 0 || v > maxVal)) {
                this.showResult(config, `Цифры должны быть от 0 до ${maxVal}`);
                return;
            }
            this.answers[config.id] = raw;
            this.saveState();

            if (config.scoring && config.scoring.custom) {
                const result = config.scoring.custom(nums);
                this.showResult(config, result);
                this.updateGlobalResult(config.id, config.label, result);
            } else {
                const total = nums.reduce((a,b) => a+b, 0);
                const result = this.interpretScore(config, total);
                this.showResult(config, result, total);
                this.updateGlobalResult(config.id, config.label, result);
            }
            return;
        }

        if (config.type !== 'text-input' && count > 0) {
            const allValues = [];
            let sum = 0;
            for (let i = 0; i < count; i++) {
                const val = this.getRadioValue(`q_${i}`);
                allValues.push(val);
                sum += val;
                this.answers[config.id] = this.answers[config.id] || {};
                this.answers[config.id][i] = val;
            }
            this.saveState();
            if (config.scoring && config.scoring.custom) {
                const result = config.scoring.custom(allValues);
                this.showResult(config, result);
                this.updateGlobalResult(config.id, config.label, result);
            } else {
                const result = this.interpretScore(config, sum);
                this.showResult(config, result, sum);
                this.updateGlobalResult(config.id, config.label, result);
            }
            return;
        }

        if (config.type === 'text-input') {
            const input = document.getElementById('textInput');
            if (input && config.scoring) {
                this.answers[config.id] = input.value;
                this.saveState();
                const result = config.scoring(input.value);
                this.showResult(config, result);
                this.updateGlobalResult(config.id, config.label, result);
            }
            return;
        }
    },

    getRadioValue(name) {
        const radios = document.getElementsByName(name);
        for (const r of radios) if (r.checked) return parseInt(r.value, 10);
        return 0;
    },

    getRadioValueStr(name) {
        const radios = document.getElementsByName(name);
        for (const r of radios) if (r.checked) return r.value;
        return '';
    },

    interpretScore(config, score) {
        if (!config.interpretation) return `${score} баллов`;
        let level = '';
        for (const rule of config.interpretation) {
            if (score >= rule.min && score <= rule.max) {
                level = rule.label;
                break;
            }
        }
        return `${score} баллов — ${level}`;
    },

    showResult(config, result, score) {
        const area = document.getElementById('resultArea');
        if (!area) return;
        let levelClass = '';
        if (config.interpretation && score !== undefined) {
            for (const rule of config.interpretation) {
                if (score >= rule.min && score <= rule.max) {
                    if (rule.level === 'low') levelClass = 'level-low';
                    else if (rule.level === 'moderate') levelClass = 'level-moderate';
                    else if (rule.level === 'high') levelClass = 'level-high';
                    break;
                }
            }
        }
        area.innerHTML = `<strong class="${levelClass}">${result}</strong>`;
    },

    clearTest(config) {
        if (!config) return;
        const isString = this.inputMode === 'string';

        if (config.id === 'bdi') {
            if (isString) {
                const input = document.getElementById('stringInput');
                if (input) { input.value = ''; input.className = ''; }
                const counter = document.getElementById('stringCounter');
                if (counter) { counter.textContent = '0 / 21'; counter.className = 'counter'; }
            } else {
                for (let i = 0; i < 21; i++) {
                    const radios = document.getElementsByName(`q_${i}`);
                    for (const r of radios) {
                        if (parseInt(r.value, 10) === 0) r.checked = true;
                        else r.checked = false;
                    }
                }
            }
            delete this.answers[config.id];
            this.saveState();
            document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
            this.clearGlobalResult(config.id);
            this.showToast(`${config.label} очищен`);
            return;
        }

        if (config.id === 'asq') {
            for (let i = 0; i < 4; i++) {
                const radios = document.getElementsByName(`asq_${i}`);
                for (const r of radios) {
                    if (r.value === '0') r.checked = true;
                    else r.checked = false;
                }
            }
            const q5Radios = document.getElementsByName('asq_q5');
            for (const r of q5Radios) {
                if (r.value === '0') r.checked = true;
                else r.checked = false;
            }
            const comment = document.getElementById('asqComment');
            if (comment) comment.value = '';
            const q5block = document.getElementById('asqQuestion5');
            if (q5block) q5block.style.display = 'none';
            delete this.answers['asq'];
            this.saveState();
            document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
            this.clearGlobalResult('asq');
            this.showToast('Методика скрининга суицидального риска очищена');
            return;
        }

        if (config.id === 'hads') {
            if (isString) {
                const ai = document.getElementById('hads_anxiety_input');
                const di = document.getElementById('hads_depression_input');
                if (ai) { ai.value = ''; ai.className = ''; }
                if (di) { di.value = ''; di.className = ''; }
                const ac = document.getElementById('hads_anxiety_counter');
                const dc = document.getElementById('hads_depression_counter');
                if (ac) { ac.textContent = '0 / 7'; ac.className = 'counter'; }
                if (dc) { dc.textContent = '0 / 7'; dc.className = 'counter'; }
            } else {
                for (let i = 0; i < 7; i++) {
                    const radiosA = document.getElementsByName(`hads_a_${i}`);
                    for (const r of radiosA) {
                        if (parseInt(r.value, 10) === 0) r.checked = true;
                        else r.checked = false;
                    }
                    const radiosD = document.getElementsByName(`hads_d_${i}`);
                    for (const r of radiosD) {
                        if (parseInt(r.value, 10) === 0) r.checked = true;
                        else r.checked = false;
                    }
                }
            }
            delete this.answers['hads'];
            this.saveState();
            document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
            this.clearGlobalResult('hads');
            this.showToast('HADS очищен');
            return;
        }

        if (config.id === 'scl90') {
            if (isString) {
                const input = document.getElementById('stringInput');
                if (input) { input.value = ''; input.className = ''; }
                const counter = document.getElementById('stringCounter');
                if (counter) { counter.textContent = '0 / 90'; counter.className = 'counter'; }
            } else {
                for (let i = 0; i < 90; i++) {
                    const radios = document.getElementsByName(`q_${i}`);
                    for (const r of radios) {
                        if (parseInt(r.value, 10) === 1) r.checked = true;
                        else r.checked = false;
                    }
                }
            }
            delete this.answers['scl90'];
            this.saveState();
            document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
            this.clearGlobalResult('scl90');
            this.showToast('SCL-90 очищен');
            return;
        }

        const count = config.questions ? config.questions.length : 0;

        if (isString && config.type !== 'text-input' && count > 0) {
            const input = document.getElementById('stringInput');
            if (input) {
                input.value = '';
                input.className = '';
                const counter = document.getElementById('stringCounter');
                if (counter) { counter.textContent = `0 / ${count}`; counter.className = 'counter'; }
            }
        }

        if (config.type === 'radio' || (!isString && config.type !== 'text-input')) {
            const firstVal = config.options ? (
                typeof config.options[0] === 'object' ? config.options[0].value : config.options[0]
            ) : 0;
            for (let i = 0; i < count; i++) {
                const radios = document.getElementsByName(`q_${i}`);
                for (const r of radios) {
                    if (parseInt(r.value, 10) === firstVal) r.checked = true;
                    else r.checked = false;
                }
            }
        }

        if (config.type === 'text-input') {
            const input = document.getElementById('textInput');
            if (input) input.value = '';
        }

        delete this.answers[config.id];
        this.saveState();
        document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
        this.clearGlobalResult(config.id);
        this.showToast(`${config.label} очищен`);
    },

    // ===== ГЛОБАЛЬНАЯ СВОДКА =====
    renderGlobalSummary() {
        const out = document.getElementById('globalOutput');
        if (!this.globalResults.length) { out.value = ''; return; }
        const now = new Date();
        const dateStr = now.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\//g, '.') + ' г.';
        let text = dateStr + '\n\n';
        const groups = {};
        this.globalResults.forEach(item => {
            const cat = testCategories[item.testId] || 'Прочее';
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(item);
        });
        const sorted = Object.keys(groups).sort((a,b) => {
            const ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
            if (ia === -1 && ib === -1) return a.localeCompare(b);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
        });
        sorted.forEach((cat, index) => {
            const items = groups[cat];
            items.sort((a,b) => a.label.localeCompare(b.label));
            text += cat + ':\n';
            items.forEach(item => {
                text += '- ' + item.label + ': ' + item.result + '\n';
            });
            if (index < sorted.length - 1) text += '\n';
        });
        out.value = text.trim();
    },

    updateGlobalResult(id, label, result) {
        const idx = this.globalResults.findIndex(i => i.testId === id);
        if (idx !== -1) this.globalResults.splice(idx, 1);
        if (result && result.trim()) {
            this.globalResults.push({ testId: id, label, result: result.trim() });
        }
        this.renderGlobalSummary();
        this.saveState();
    },

    clearGlobalResult(id) {
        const idx = this.globalResults.findIndex(i => i.testId === id);
        if (idx !== -1) {
            this.globalResults.splice(idx, 1);
            this.renderGlobalSummary();
            this.saveState();
        }
    },

    clearAll() {
        this.globalResults = [];
        this.answers = {};
        this.renderGlobalSummary();
        this.saveState();
        document.querySelectorAll('.btn-danger').forEach(btn => btn.click());
        this.showToast('Все тесты и сводка очищены');
    },

    setupGlobalButtons() {
        document.getElementById('copyGlobalBtn').addEventListener('click', () => {
            const ta = document.getElementById('globalOutput');
            navigator.clipboard.writeText(ta.value).then(() => this.showToast('Сводка скопирована')).catch(() => {
                ta.select();
                document.execCommand('copy');
                this.showToast('Сводка скопирована');
            });
        });
        document.getElementById('clearGlobalBtn').addEventListener('click', () => this.clearAll());
    },

    showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.style.opacity = '0', 2500);
    }
};

// ---- Вспомогательные функции ----
function renderGenericRadio(config, container) {
    const saved = Engine.answers[config.id] || {};
    const opts = config.options || [0,1,2,3];
    let html = `<div class="test-title">${config.icon || '📋'} ${config.label} <span class="badge">${config.badge || ''}</span></div>`;
    if (config.desc) html += `<div class="test-desc">${config.desc}</div>`;
    html += `<div id="itemsContainer">`;
    config.questions.forEach((text, idx) => {
        html += `<div class="question-row"><div class="q-label"><span class="q-num">${idx+1}.</span> ${text}</div><div class="radio-group">`;
        opts.forEach((opt, oi) => {
            const val = typeof opt === 'object' ? opt.value : opt;
            const label = typeof opt === 'object' ? opt.label : String(opt);
            const checked = saved[idx] === val ? 'checked' : '';
            html += `<label><input type="radio" name="q_${idx}" value="${val}" ${checked}> ${label}</label>`;
        });
        html += `</div></div>`;
    });
    html += `</div>`;
    html += `<div style="margin-top:1rem;"><button class="btn" id="calcBtn">Рассчитать</button><button class="btn btn-danger" id="clearBtn">Очистить</button></div>`;
    html += `<div class="result-area" id="resultArea">Ожидание расчёта</div>`;
    container.innerHTML = html;

    document.getElementById('calcBtn').addEventListener('click', () => {
        let sum = 0;
        const allValues = [];
        const count = config.questions.length;
        for (let i = 0; i < count; i++) {
            const val = Engine.getRadioValue(`q_${i}`);
            allValues.push(val);
            sum += val;
            Engine.answers[config.id] = Engine.answers[config.id] || {};
            Engine.answers[config.id][i] = val;
        }
        Engine.saveState();
        if (config.scoring && config.scoring.custom) {
            const result = config.scoring.custom(allValues);
            Engine.showResult(config, result);
            Engine.updateGlobalResult(config.id, config.label, result);
        } else {
            const result = Engine.interpretScore(config, sum);
            Engine.showResult(config, result, sum);
            Engine.updateGlobalResult(config.id, config.label, result);
        }
    });
    document.getElementById('clearBtn').addEventListener('click', () => Engine.clearTest(config));

    for (let i = 0; i < config.questions.length; i++) {
        const radios = document.getElementsByName(`q_${i}`);
        for (const r of radios) {
            r.addEventListener('change', () => {
                Engine.answers[config.id] = Engine.answers[config.id] || {};
                Engine.answers[config.id][i] = parseInt(r.value, 10);
                Engine.saveState();
                const btn = document.getElementById('calcBtn');
                if (btn) btn.click();
            });
        }
    }
    if (Object.keys(saved).length > 0) setTimeout(() => { const btn = document.getElementById('calcBtn'); if (btn) btn.click(); }, 50);
}

function renderMoca(container) {
    const config = testConfigs.moca;
    container.innerHTML = `<div class="test-title">${config.icon} ${config.label} <span class="badge">${config.badge}</span></div>
        <div class="test-desc">${config.desc}</div>
        <div style="margin-bottom:10px;"><input type="text" id="textInput" style="width:100%;padding:8px 14px;border-radius:1rem;border:2px solid var(--border);font-size:1rem;background:var(--card);color:var(--text);" placeholder="Введите сумму баллов (0-30)"></div>
        <div style="margin-top:1rem;"><button class="btn" id="calcBtn">Рассчитать</button><button class="btn btn-danger" id="clearBtn">Очистить</button></div>
        <div class="result-area" id="resultArea">Ожидание расчёта</div>`;
    const input = document.getElementById('textInput');
    const saved = Engine.answers['moca'] || '';
    input.value = saved;
    input.addEventListener('input', () => {
        Engine.answers['moca'] = input.value;
        Engine.saveState();
        const result = config.scoring(input.value);
        Engine.showResult(config, result);
        Engine.updateGlobalResult('moca', config.label, result);
    });
    document.getElementById('calcBtn').addEventListener('click', () => {
        const result = config.scoring(input.value);
        Engine.showResult(config, result);
        Engine.updateGlobalResult('moca', config.label, result);
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
        input.value = '';
        delete Engine.answers['moca'];
        Engine.saveState();
        document.getElementById('resultArea').innerHTML = 'Ожидание расчёта';
        Engine.clearGlobalResult('moca');
        Engine.showToast('MoCA очищен');
    });
    if (saved) setTimeout(() => { const result = config.scoring(saved); Engine.showResult(config, result); Engine.updateGlobalResult('moca', config.label, result); }, 50);
}
